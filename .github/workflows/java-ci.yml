name: Java CI — synthetic GARCH VaR
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and run JUnit tests
        run: mvn --batch-mode --no-transfer-progress clean test
      - name: Execute end-to-end example
        run: |
          mvn --batch-mode --no-transfer-progress exec:java | tee demo-output.txt
          grep -q 'SYNTHETIC EDUCATIONAL DEMO' demo-output.txt
          grep -q 'Mean absolute P&L approximation error' demo-output.txt
